  <script>
    const video = document.getElementById('bgvideo');

    // Function to play forward
    function playForward() {
      video.currentTime = 0;
      video.play();
    }

    // Function to play reverse
    function playReverse() {
      if (video.currentTime <= 0) {
        video.currentTime = video.duration;
      }
      video.currentTime -= 0.033; // Assuming 30fps, adjust as needed
      if (video.currentTime > 0) {
        setTimeout(playReverse, 33); // Recurse
      } else {
        // Loop: set to end and play reverse again, but since it's after playForward, maybe loop back
        video.currentTime = video.duration;
        playReverse();
      }
    }

    // Initially play forward
    video.addEventListener('ended', () => {
      playReverse();
    });
  </script>
